<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0078D7"/>
      <stop offset="100%" style="stop-color:#00BCF2"/>
    </linearGradient>
    <linearGradient id="fg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#E0E0E0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="192" height="192" rx="32" fill="url(#bg)" filter="url(#shadow)"/>
  
  <!-- Letter R -->
  <text x="96" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="120" font-weight="bold" fill="url(#fg)" text-anchor="middle">R</text>
  
  <!-- Decorative rocket trail -->
  <path d="M 50 160 Q 70 140 96 120" stroke="#FFD700" stroke-width="4" fill="none" opacity="0.8"/>
  <circle cx="50" cy="160" r="6" fill="#FFD700"/>
</svg>