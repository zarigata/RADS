[package]
name = "rads-lsp"
version = "0.1.1"
edition = "2021"
authors = ["RADS Team"]
description = "Language Server Protocol implementation for RADS programming language"
license = "MIT"
repository = "https://github.com/zarigata/RADS"
keywords = ["language-server", "lsp", "rads", "ide"]
categories = ["development-tools", "text-editors"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.29"
tower-lsp = "0.20"
lsp-types = "0.97"
regex = "1.11"
log = "0.4"
env_logger = "0.11"
tower = "0.5"
tower-http = "0.5"
futures = "0.3"

[dev-dependencies]
pretty_assertions = "1.4"

[lib]
name = "rads_lsp"
path = "src/lib.rs"

[[bin]]
name = "rads-lsp"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 2